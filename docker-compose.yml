services:
  app:
    build:
      context: .
    environment:
      APP_HTTP_ADDR: :8080
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/wager-service", "healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 2s
