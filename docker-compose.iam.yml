services:
  ministack:
    image: ministackorg/ministack:1.5.15
    environment:
      AUTH: "true"
      SERVICES: sqs,iam,sts
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack/init:/etc/localstack/init/ready.d:ro
      - ./deploy/aws:/policies:ro
      - ./scripts/verify_local_sqs_policies.sh:/verification/verify.sh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
